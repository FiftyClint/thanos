# Fly.io deployment.
#
# Fly suits this app: one long-lived process, a Postgres beside it, a volume for
# photos, and HTTPS out of the box — which an installed PWA requires.
#
# First deploy:
#   fly launch --no-deploy --copy-config
#   fly postgres create --name thanos-db
#   fly postgres attach thanos-db          # sets DATABASE_URL
#   fly volumes create thanos_data --size 3 --region <your-region>
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32)
#   fly deploy
#
# Afterwards, close signups so only your account exists:
#   fly secrets set ALLOW_REGISTRATION=false

app = "thanos-program"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"
  UPLOAD_DIR = "/data"
  FILE_STORE = "local"
  AUTO_MIGRATE = "true"
  AUTO_SEED = "true"
  DATABASE_SSL = "false"
  TRUST_PROXY = "1"
  LOG_LEVEL = "info"

# Progress photos live here. A volume is tied to one machine, so keep the app
# at a single instance — or switch to FILE_STORE=s3 to scale past one.
[[mounts]]
  source = "thanos_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  # Never scale to zero: a cold start mid-workout is worse than the idle cost.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
